<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campeonato Mineiro - Segunda Divisão 2026 - Mapa</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0E1912;
      color: #EFEAD9;
    }
    .container {
      display: flex;
      height: 100vh;
    }
    #map {
      flex: 1;
      background: #1a1a1a;
    }
    .sidebar {
      width: 320px;
      background: #152417;
      border-right: 1px solid #33452F;
      overflow-y: auto;
      padding: 20px;
    }
    .sidebar h1 {
      font-size: 20px;
      color: #CBA135;
      margin-bottom: 8px;
      font-weight: bold;
    }
    .sidebar .subtitle {
      font-size: 12px;
      color: #A7AB9C;
      margin-bottom: 20px;
      font-family: 'IBM Plex Mono', monospace;
    }
    .cidade-group {
      margin-bottom: 20px;
      padding: 12px;
      background: #1D301F;
      border: 1px solid #33452F;
      border-radius: 8px;
    }
    .cidade-nome {
      font-weight: 600;
      color: #CBA135;
      font-size: 14px;
      margin-bottom: 8px;
    }
    .time-item {
      font-size: 12px;
      color: #A7AB9C;
      padding: 4px 0;
      padding-left: 12px;
      border-left: 2px solid #33452F;
    }
    .time-item:hover {
      color: #EFEAD9;
      border-left-color: #CBA135;
    }
    .stats {
      padding: 12px;
      background: #1D301F;
      border: 1px solid #33452F;
      border-radius: 8px;
      font-size: 12px;
      margin-bottom: 20px;
      font-family: 'IBM Plex Mono', monospace;
    }
    .stats-row {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
    }
    .stats-label { color: #A7AB9C; }
    .stats-value { color: #CBA135; font-weight: 600; }
    .leaflet-popup-content-wrapper {
      background: #1D301F !important;
      border: 1px solid #33452F !important;
      color: #EFEAD9 !important;
    }
    .leaflet-popup-tip { background: #1D301F !important; }
    .leaflet-popup-content {
      font-size: 12px !important;
      margin: 8px !important;
    }
    @media (max-width: 768px) {
      .sidebar {
        position: absolute;
        left: 0;
        top: 0;
        height: 100%;
        z-index: 1000;
        max-width: 80vw;
        box-shadow: 2px 0 10px rgba(0,0,0,0.5);
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="sidebar">
      <h1>Campeonato Mineiro</h1>
      <div class="subtitle">SEGUNDA DIVISÃO 2026</div>

      <div class="stats">
        <div class="stats-row">
          <span class="stats-label">Cidades</span>
          <span class="stats-value" id="total-cidades">12</span>
        </div>
        <div class="stats-row">
          <span class="stats-label">Times</span>
          <span class="stats-value" id="total-times">12</span>
        </div>
        <div class="stats-row">
          <span class="stats-label">Rodadas</span>
          <span class="stats-value">5+</span>
        </div>
      </div>

      <div id="cidades-list"></div>
    </div>

    <div id="map"></div>
  </div>

  <script>
    const data = {
      "cidades": {
        "Araxá": {"lat": -19.5908, "lng": -46.9445},
        "Belo Horizonte": {"lat": -19.9191, "lng": -43.9386},
        "Betim": {"lat": -19.9686, "lng": -44.1975},
        "Itabirinha": {"lat": -19.1708, "lng": -42.1847},
        "Itaúna": {"lat": -19.9944, "lng": -44.5725},
        "Lavras": {"lat": -21.2455, "lng": -44.9968},
        "Montes Claros": {"lat": -16.7317, "lng": -43.8532},
        "Muriaé": {"lat": -21.1014, "lng": -42.3671},
        "Paracatu": {"lat": -18.8945, "lng": -46.8699},
        "Sabará": {"lat": -20.0218, "lng": -43.8106},
        "Santa Rita do Sapucaí": {"lat": -21.9464, "lng": -45.1906},
        "São João Del-rei": {"lat": -20.8871, "lng": -43.7519}
      },
      "times": {
        "ARAXÁ ESPORTE CLUBE SAF": "Araxá",
        "ASSOCIAÇÃO ESPORTIVA PARACATU": "Paracatu",
        "BETIM FUTEBOL (\"B\")": "Betim",
        "ESPORTE CLUBE NOVA LAVRAS": "Lavras",
        "ESPORTE CLUBE SIDERÚRGICA": "Sabará",
        "FUNORTE ESPORTE CLUBE": "Montes Claros",
        "NACIONAL ATLÉTICO CLUBE - MURIAÉ": "Muriaé",
        "NOVO ESPORTE CLUBE ITABIRINHA": "Itabirinha",
        "SANTARRITENTE FUTEBOL CLUBE": "Santa Rita do Sapucaí",
        "SÃO JOÃO DEL REI ESPORTE CLUBE": "São João Del-rei",
        "VENDA NOVA FUTEBOL CLUBE SAF": "Belo Horizonte",
        "ASSOCIAÇÃO DESPORTIVA INTERNACIONAL": "Itaúna"
      }
    };

    // Inicializar mapa (centralizando em Minas Gerais)
    const map = L.map('map').setView([-19.5, -44.5], 8);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '© OpenStreetMap contributors',
      maxZoom: 18,
      tileSize: 256
    }).addTo(map);

    // Agrupar times por cidade
    const timesPorCidade = {};
    for (const [time, cidade] of Object.entries(data.times)) {
      if (!timesPorCidade[cidade]) timesPorCidade[cidade] = [];
      timesPorCidade[cidade].push(time);
    }

    // Cores para os markers
    const cores = [
      '#CBA135', '#5FA772', '#C15A3E', '#5B8FBF',
      '#E8A838', '#7BC67B', '#D97D5A', '#6BA3D3'
    ];

    // Criar markers
    Object.entries(data.cidades).forEach(([cidade, coords], idx) => {
      const cor = cores[idx % cores.length];
      const times = timesPorCidade[cidade] || [];

      const popupContent = `
        <div style="min-width: 220px;">
          <div style="font-weight: bold; color: #CBA135; margin-bottom: 8px; font-size: 14px;">${cidade}</div>
          <div style="font-size: 11px; color: #A7AB9C;">
            ${times.length} time(s):
          </div>
          <div style="margin-top: 6px; font-size: 11px;">
            ${times.map(t => {
              const cleanName = t.replace(/"/g, '').replace(/\s+\(.*\)/, '').trim();
              return `<div style="padding: 2px 0; color: #EFEAD9;">• ${cleanName}</div>`;
            }).join('')}
          </div>
        </div>
      `;

      const marker = L.circleMarker([coords.lat, coords.lng], {
        radius: times.length > 1 ? 12 : 10,
        fillColor: cor,
        color: '#EFEAD9',
        weight: 2,
        opacity: 1,
        fillOpacity: 0.8
      })
      .bindPopup(popupContent)
      .addTo(map);

      // Tooltip ao passar mouse
      marker.bindTooltip(cidade, { permanent: false, direction: 'top' });
    });

    // Preencher sidebar
    const listDiv = document.getElementById('cidades-list');
    const cidades = Object.keys(data.cidades).sort();

    cidades.forEach(cidade => {
      const times = timesPorCidade[cidade] || [];
      const div = document.createElement('div');
      div.className = 'cidade-group';
      div.innerHTML = `
        <div class="cidade-nome">${cidade}</div>
        ${times.map(t => {
          const cleanName = t.replace(/"/g, '').replace(/\s+\(.*\)/, '').trim();
          return `<div class="time-item">${cleanName}</div>`;
        }).join('')}
      `;
      listDiv.appendChild(div);
    });

    // Atualizar stats
    document.getElementById('total-cidades').textContent = Object.keys(data.cidades).length;
    document.getElementById('total-times').textContent = Object.keys(data.times).length;
  </script>
</body>
</html>
