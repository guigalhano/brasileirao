name: Atualizar dados do Cartola FC

# Tres vezes por dia. O mercado do Cartola muda preco/status ao longo do dia
# e fecha pouco antes da rodada; uma passada diaria as 06:00 UTC pegava o
# estado da madrugada e servia isso por 24h.
on:
  schedule:
    - cron: "0 9 * * *"    # 06:00 BRT -- resultados da noite anterior
    - cron: "0 15 * * *"   # 12:00 BRT -- escalacoes e status do dia
    - cron: "0 21 * * *"   # 18:00 BRT -- ultima foto antes dos jogos da noite
  workflow_dispatch: {}

permissions:
  contents: write

# Duas execucoes ao mesmo tempo dariam push concorrente no main. A segunda
# espera; nao cancela, porque uma coleta pela metade e pior que uma fila.
concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # scikit-learn entrou em 18/09: o elo_odds_model.py e o
      # estender_valuebet_2026.py usam LogisticRegression e foram adicionados
      # ao workflow sem que a dependencia viesse junto. Como os dois so rodam
      # quando entra RESULTADO NOVO, a falha era intermitente -- verde nos dias
      # sem jogo, ModuleNotFoundError nos dias com jogo.
      - name: Instalar dependencias
        run: pip install requests pandas numpy scipy scikit-learn

      # Confere os imports ANTES de coletar nada. Dependencia faltando falhava
      # so la na frente, depois de mais de um minuto de coleta, e num passo
      # condicional -- o jeito mais caro possivel de descobrir.
      - name: Conferir dependencias
        run: python -c "import requests, pandas, numpy, scipy, sklearn; print('dependencias OK')"

      # ---------- 1. COLETA (tudo que vem de fora) ----------
      # Nenhuma etapa usa continue-on-error, e isso continua proposital: era
      # o que mantinha o workflow verde enquanto o historico de scouts
      # congelava na rodada 21 com KeyError todo dia.
      #
      # Mas em setembro descobrimos que so isso era rigido demais. O
      # football-data.co.uk devolveu 503 por dois dias e, como e o primeiro
      # passo, derrubou o job inteiro -- inclusive o mercado do Cartola, que
      # nao depende dele. O site ficou cinco dias parado por causa de um
      # terceiro fora do ar.
      #
      # A distincao agora e feita DENTRO de cada script (scripts/lib/rede.py),
      # que e onde se sabe o que cada erro significa:
      #   - 503/timeout/conexao  -> tenta 3x com espera crescente; se insistir,
      #                             segue sem aquela fonte e avisa;
      #   - KeyError/404/schema  -> quebra alto, como antes.
      # A rede de seguranca e o portao no fim: se a degradacao deixar o dado
      # velho demais, ele bloqueia a publicacao.

      - name: Resultados novos das partidas (football-data.co.uk)
        run: python scripts/ingerir_resultados.py

      # O reajuste do modelo so faz sentido se entrou resultado novo. O
      # otimizador do Dixon-Coles nao e deterministico ao nivel do 4o decimal:
      # refitar com os MESMOS jogos mexe o ataque de cada time em ~0.0008 e
      # gera um diff de 140 linhas do nada. Rodando 3x por dia isso seria
      # ~1000 commits de ruido por ano e anularia a guarda de "nada mudou".
      - name: O CSV de resultados mudou?
        id: resultados
        run: |
          if git diff --quiet -- data/matches_2012_2026.csv; then
            echo "mudou=false" >> "$GITHUB_OUTPUT"
            echo "Nenhum resultado novo -- modelo mantido como esta."
          else
            echo "mudou=true" >> "$GITHUB_OUTPUT"
            echo "Resultados novos ingeridos -- o modelo sera reajustado."
          fi

      - name: Confrontos da rodada atual (API do Cartola)
        run: python scripts/atualizar_confrontos_cartola.py

      - name: Rodadas novas do historico de scouts (API do Cartola)
        run: python scripts/atualizar_historico_cartola.py

      - name: Mercado atual do Cartola (preco, media, status)
        run: python scripts/atualizar_mercado_cartola.py

      # ---------- 2. MODELO (reajusta com os resultados novos) ----------
      # Sem estas duas etapas a ingestao de resultados nao servia pra nada:
      # os ratings continuavam os de semanas atras. A ordem importa --
      # fit_model_v2 produz team_ratings_final_v2.json, e recalibrar produz o
      # team_ratings_calibrado.json, que e o arquivo que o resto do pipeline
      # prefere quando existe.
      - name: Reajustar o Dixon-Coles com os resultados atualizados
        if: steps.resultados.outputs.mudou == 'true'
        run: python scripts/fit_model_v2.py --repo-dir .

      # O xG do WhoScored (data/whoscored_xg_2026.csv) continua sendo coleta
      # manual -- o site bloqueia scraping automatizado. Nao trava o ciclo: o
      # recalibrar_com_whoscored.py normaliza por JOGO justamente para tolerar
      # que o xG cubra menos partidas que o CSV de resultados (ver o cabecalho
      # dele). O efeito de deixar esse arquivo envelhecer e a ancora de xG
      # perder atualidade aos poucos, nao o pipeline quebrar.
      - name: Recalibrar ataque/defesa com o xG do WhoScored
        if: steps.resultados.outputs.mudou == 'true'
        run: python scripts/recalibrar_com_whoscored.py --repo-dir .

      # O Elo-Odds alimenta a aba Preditor pelo bloco var ELO do index.html.
      # Ate setembro/2026 o data/elo_odds_final.json era gerado a mao e ficou
      # parado em 24/07: o Flamengo estava 40 pontos de Elo defasado, numa
      # escala onde o mando de campo inteiro vale 60. Leva ~37s (faz busca em
      # grade), por isso so roda quando entrou resultado novo.
      - name: Reajustar o Elo-Odds
        if: steps.resultados.outputs.mudou == 'true'
        run: python scripts/elo_odds_model.py

      # ---------- 3. SINAIS POR JOGADOR ----------
      # PRECISA vir antes do build_index.py: e este script que grava o
      # advanced_signals.csv (desarme, pontuacao esperada por scout, forma
      # ajustada) que o build_index le pra montar o array PLAYERS. Rodando na
      # ordem errada, o site publica os sinais da execucao ANTERIOR.
      - name: Recalcular sinais por jogador (desarme, E[pts] por scout, forma)
        run: python scripts/compute_advanced_signals.py --repo-dir .

      # Pontuacao do time do usuario, rodada a rodada, contra o "time medio".
      # O endpoint /time/id/{id}/{rodada} e publico e nao pede autenticacao.
      # Sem --ate-rodada, o script vai ate onde o historico de scouts alcanca.
      - name: Atualizar o historico do meu time
        run: |
          python scripts/comparar_historico_time.py \
            --time-id 199236 --saida data/meu_time_historico.csv

      # Estende o backtest de 4 modelos da aba Value Betting com os jogos
      # novos. Ficou 7 semanas parado (199 de 257 jogos de 2026) porque nunca
      # esteve no workflow. So roda quando entra resultado novo.
      #
      # O --max-odds-csv mantem a metodologia: todos os modelos apostam na
      # MELHOR cota (Max), nao na media. O BRA.csv do football-data traz
      # MaxCH/MaxCD/MaxCA, e o ingerir_resultados.py ja baixou esse arquivo.
      - name: Estender o backtest de Value Betting
        if: steps.resultados.outputs.mudou == 'true'
        run: |
          curl -sS -o /tmp/BRA.csv https://www.football-data.co.uk/new/BRA.csv || true
          if [ -s /tmp/BRA.csv ]; then
            python scripts/estender_valuebet_2026.py --repo-dir . --max-odds-csv /tmp/BRA.csv
          else
            echo "BRA.csv indisponivel -- estendendo com a cota media como preco."
            python scripts/estender_valuebet_2026.py --repo-dir .
          fi

      # ---------- 4. MONTAGEM DO SITE ----------
      - name: Regenerar o array de jogadores no index.html
        run: python scripts/build_index.py

      - name: Regenerar a aba "Meu Time"
        run: python scripts/build_meu_time_tab.py

      # Blocos que ate agosto/2026 nao tinham gerador nenhum e iam ficando
      # para tras em silencio: os ratings que a aba PREDITOR usa (estavam
      # divergindo do modelo em ate 1,6x no ataque), o top 3 do cabecalho
      # ("as of 2026-07-27") e o rotulo "RODADA N".
      - name: Sincronizar ratings, classificacao e rotulo da rodada
        run: python scripts/sincronizar_index.py --repo-dir .

      # As duas etapas abaixo sao um par e precisam rodar NA ORDEM.
      # A primeira grava model/xg; a segunda repoe analysis/analysis_grid.
      # Rodar so a primeira foi o que deixou a aba de analises fora do ar
      # entre as rodadas 21 e 23 (ver scripts/lib/index_data.py).
      - name: Atualizar proximos confrontos (modelo)
        run: python scripts/update_next_matches_dynamic.py --repo-dir .

      - name: Repor as analises dos confrontos
        run: python scripts/generate_advanced_analytics.py --repo-dir .

      # Odds PRE-JOGO da rodada que vem, pra coluna de "edge" da aba Proximos
      # Jogos. As odds de FECHAMENTO dos jogos ja disputados nao passam por
      # aqui -- vem de graca com o placar, no ingerir_resultados.py.
      #
      # Sem o secret ODDS_API_KEY o script sai com 0 e nao faz nada: odds
      # pre-jogo enriquecem o site, nao o sustentam, e derrubar a atualizacao
      # inteira por falta de uma chave opcional seria desproporcional.
      # Para ligar: Settings > Secrets and variables > Actions > New repository
      # secret, nome ODDS_API_KEY. Cota gratuita de 500 req/mes; 3 execucoes
      # por dia consomem ~90.
      - name: Odds de mercado dos proximos jogos (opcional)
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/atualizar_odds_mercado.py --repo-dir .

      # ---------- 5. PORTAO ----------
      # Confere confrontos, analises, frescor dos resultados e a tabela de
      # pontuacao do Cartola contra a oficial. Sai != 0 => nao publica.
      - name: Conferir integridade antes de publicar
        run: python scripts/verificar_integridade.py --repo-dir .

      - name: Commit e push se algo mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ index.html
          if git diff --cached --quiet; then
            echo "Nada mudou desde a ultima atualizacao, nao commitando."
          else
            git commit -m "Atualizacao automatica dos dados do Cartola FC ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            # Outra execucao pode ter empurrado enquanto esta rodava.
            git pull --rebase --autostash origin main
            git push
          fi
